name: CineRate CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      SECRET_KEY: "ci-testing-secret-key-placeholder"
      DEBUG: "False"
      ALLOWED_HOSTS: "localhost,127.0.0.1"
      CLOUDINARY_CLOUD_NAME: "ci_dummy_cloud"
      CLOUDINARY_API_KEY: "1234567890"
      CLOUDINARY_API_SECRET: "ci_dummy_secret"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify no uncreated migrations exist
        run: python manage.py makemigrations --check --dry-run

      - name: Run Django system checks
        run: python manage.py check

      - name: Run automated test suite
        run: python manage.py test movie

  deploy-production:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render Deployment
        run: curl -f -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"